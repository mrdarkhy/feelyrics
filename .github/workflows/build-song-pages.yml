name: Build song pages

# Rebuilds songs/<id>.html, songs/index.html, sitemap.xml and robots.txt from songs.js
# and commits them back to the same branch. GitHub Pages then serves them as-is.
on:
  push:
    branches: [main]
    paths:
      - "songs.js"
      - "tools/build-song-pages.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-song-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate pages
        run: node tools/build-song-pages.mjs
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add songs sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Rebuild song pages from songs.js"
          git push
